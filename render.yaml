services:
  # ==========================================
  # Backend Web Service (Node.js + Express)
  # ==========================================
  - type: web
    name: ranju-art-gallery-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # Set to your frontend Render URL, e.g. https://ranju-art-gallery.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 12
      - key: DEFAULT_ARTIST_NAME
        value: Ranju Kumar
      - key: DEFAULT_CONTACT_EMAIL
        value: karansin8672@gmail.com
      - key: DEFAULT_CONTACT_PHONE
        value: "+91 8294618672"
      - key: DEFAULT_WHATSAPP_NUMBER
        value: "918294618672"
      - key: DEFAULT_INSTAGRAM_URL
        value: https://instagram.com/with_sk.2
      - key: DEFAULT_YOUTUBE_URL
        value: https://www.youtube.com/

  # ==========================================
  # Frontend Static Site (React + Vite)
  # ==========================================
  - type: static
    name: ranju-art-gallery
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://ranju-art-gallery-backend.onrender.com/api
      - key: VITE_SERVER_URL
        sync: false # Set to https://ranju-art-gallery-backend.onrender.com
