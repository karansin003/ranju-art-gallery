services:
  # ========================================================
  # Ranju Art Gallery — Unified Web Service (Express + React)
  # ========================================================
  - type: web
    name: ranju-art-gallery
    env: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://ranjuart.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 12
      - key: DEFAULT_ARTIST_NAME
        value: Ranju Kumar
      - key: DEFAULT_CONTACT_EMAIL
        value: karansin8672@gmail.com
      - key: DEFAULT_CONTACT_PHONE
        value: "+91 8294618672"
      - key: DEFAULT_WHATSAPP_NUMBER
        value: "918294618672"
      - key: DEFAULT_INSTAGRAM_URL
        value: https://instagram.com/with_sk.2
      - key: DEFAULT_YOUTUBE_URL
        value: https://www.youtube.com/
