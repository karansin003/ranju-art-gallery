services:
  # ========================================================
  # Ranju Art Gallery — Unified Web Service (Express + React)
  # ========================================================
  - type: web
    name: ranju-art-gallery
    env: node
    plan: free
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://ranjuart.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 12
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEFAULT_ARTIST_NAME
        value: Ranju Kumari
      - key: DEFAULT_CONTACT_EMAIL
        value: ranjukumari754@gmail.com
      - key: DEFAULT_CONTACT_PHONE
        value: "+91 9717157794"
      - key: DEFAULT_WHATSAPP_NUMBER
        value: "919717157794"
      - key: DEFAULT_INSTAGRAM_URL
        value: https://www.instagram.com/ranju_creators
      - key: DEFAULT_YOUTUBE_URL
        value: https://www.youtube.com/@ranju_craft_creater
